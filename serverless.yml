
org: ${file(./local.yml):org}
service: shui

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  region: eu-north-1
  stage: dev

  environment:
    USERS_TABLE: ${self:service}-${sls:stage}-users
    POSTS_TABLE: ${self:service}-${sls:stage}-posts

  iam:
    role: ${file(./local.yml):role}

functions:
  register:
    handler: functions/auth/register/index.handler
    events:
      - httpApi:
          path: /auth/register
          method: POST

  login:
    handler: functions/auth/login/index.handler
    events:
      - httpApi:
          path: /auth/login
          method: POST

  getPosts:
    handler: functions/posts/getPosts/index.handler
    events:
      - httpApi:
          path: /posts
          method: GET

  getPost:
    handler: functions/posts/getPost/index.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: GET

  addPost:
    handler: functions/posts/addPost/index.handler
    events:
      - httpApi:
          path: /posts
          method: POST

  updatePost:
    handler: functions/posts/updatePost/index.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: PUT

  deletePost:
    handler: functions/posts/deletePost/index.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: DELETE

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: username
            AttributeType: S
        KeySchema:
          - AttributeName: username
            KeyType: HASH

    PostsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-posts
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: feedKey
            AttributeType: S
          - AttributeName: createdAtId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: posts-by-date-index
            KeySchema:
              - AttributeName: feedKey
                KeyType: HASH
              - AttributeName: createdAtId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
