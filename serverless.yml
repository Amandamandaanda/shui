
service: shui

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  region: eu-north-1
  stage: dev

  environment:
    USERS_TABLE: ${self:service}-${sls:stage}-users
    POSTS_TABLE: ${self:service}-${sls:stage}-posts

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
          Resource:
            - Fn::GetAtt: [UsersTable, Arn]
            - Fn::GetAtt: [PostsTable, Arn]

functions:
  register:
    handler: functions/auth/register/index.handler
    events:
      - httpApi:
          path: /auth/register
          method: POST

  login:
    handler: functions/auth/login/index.handler
    events:
      - httpApi:
          path: /auth/login
          method: POST

  getPosts:
    handler: functions/posts/getPosts/index.handler
    events:
      - httpApi:
          path: /posts
          method: GET

  getPost:
    handler: functions/posts/getPost/index.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: GET

  addPost:
    handler: functions/posts/addPost/index.handler
    events:
      - httpApi:
          path: /posts
          method: POST

  updatePost:
    handler: functions/posts/updatePost/index.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: PUT

  deletePost:
    handler: functions/posts/deletePost/index.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: DELETE

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.USERS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: username
            AttributeType: S
        KeySchema:
          - AttributeName: username
            KeyType: HASH

    PostsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.POSTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
